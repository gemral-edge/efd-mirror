name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: pip install curl_cffi
      - run: |
          python - <<'P'
          import re
          from curl_cffi import requests
          E="https://efdsearch.senate.gov"
          for imp in ("chrome120","chrome131","safari17_0"):
              s=requests.Session(impersonate=imp)
              v=s.get(E+"/search/view/ptr/000e724b-fb9a-4922-9011-ca8925a047f3/",timeout=30)
              print(imp,"view-no-agree",v.status_code,v.url[-40:],"table" in v.text)
              r=s.get(E+"/search/home/",timeout=30)
              m=re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"',r.text)
              p=s.post(E+"/search/home/",data={"csrfmiddlewaretoken":m.group(1),"prohibition_agreement":"1"},
                       headers={"Referer":E+"/search/home/","Origin":E},timeout=30)
              print(imp,"home",r.status_code,"agree",p.status_code)
              v=s.get(E+"/search/view/ptr/000e724b-fb9a-4922-9011-ca8925a047f3/",timeout=30)
              print(imp,"view-after",v.status_code,v.url[-40:],"<table" in v.text)
              g=s.get(E+"/search/report/data/?start=0&length=10&report_types=[11]&submitted_start_date=10/01/2026",timeout=30)
              print(imp,"data-GET",g.status_code,g.text[:80].replace("\n"," "))
          P
